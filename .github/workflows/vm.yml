name: vm

# Experiment branch for VT-33 (not for merge): only the probe runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vt33:
    name: vt33 probe ${{ matrix.platform }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, debian13, ubuntu2404]
        rep: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run the VT-33 probe
        run: python3 tests/vm.py --suite vt33 --platform '${{ matrix.platform }}' --arch amd64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-vt33-${{ matrix.platform }}-${{ matrix.rep }}
          path: .tmp/vm/evidence/
          retention-days: 14
