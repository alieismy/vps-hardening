name: vm

on:
  pull_request:
    paths: ['bin/**', 'lib/**', 'tests/**', '.github/workflows/vm.yml']
  push:
    branches: [master]
    paths: ['bin/**', 'lib/**', 'tests/**', '.github/workflows/vm.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full matrix (verification plan 3.1): VT-01, the unhardened part of VT-50,
  # the guest-side source address and the sshd probe study (VO-2).
  matrix:
    name: matrix ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, debian13, ubuntu2404]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          if [ '${{ matrix.arch }}' = arm64 ]; then qemu='qemu-system-arm qemu-efi-aarch64'; else qemu='qemu-system-x86'; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq $qemu qemu-utils cloud-image-utils
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run the matrix suite
        run: python3 tests/vm.py --suite matrix --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-matrix-${{ matrix.platform }}-${{ matrix.arch }}
          path: .tmp/vm/evidence/
          retention-days: 14

  # Architecture-independent logic on the three platforms (amd64): VT-02,
  # VT-03 (S1-S4) and VT-04, plus the UFW path check.
  negative:
    name: negative ${{ matrix.platform }} amd64
    strategy:
      fail-fast: false
      matrix:
        platform: [debian12, debian13, ubuntu2404]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Run the negative suite
        run: python3 tests/vm.py --suite negative --platform '${{ matrix.platform }}' --arch amd64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-negative-${{ matrix.platform }}-amd64
          path: .tmp/vm/evidence/
          retention-days: 14
